<!doctype html>
<html lang="nl" data-client="mkb-advies">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><title>MKB Advies · Klantdashboard</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f3ef;color:#17251e;font:16px/1.5 system-ui,sans-serif}[hidden]{display:none!important}#login{min-height:100svh;display:grid;place-items:center;padding:24px}.card{width:min(100%,440px);background:#fff;padding:40px;border:1px solid #d8ddd6;border-radius:20px;box-shadow:0 18px 60px #17251e0a}.brand{font-size:12px;font-weight:750;letter-spacing:.1em;text-transform:uppercase;color:#4c6958}.lock{margin-top:32px;color:#55715d;font-size:13px}h1{font-size:30px;line-height:1.2;margin:10px 0 16px;letter-spacing:-.03em}p{color:#58635b}label{display:block;font-size:14px;font-weight:650}input[type=password],input[type=text]{width:100%;border:1px solid #a8b5aa;border-radius:9px;font:inherit;padding:12px;margin:8px 0 12px}input:focus{outline:3px solid #a8d6b5;outline-offset:2px}.show{display:flex;align-items:center;gap:8px;font-weight:400;color:#58635b}.show input{width:16px;height:16px}button{font:inherit;cursor:pointer;border:0;border-radius:9px;padding:12px 18px;background:#234f37;color:#fff;font-weight:650}#submit{margin-top:24px;width:100%}button:disabled{opacity:.65;cursor:wait}#status{font-size:14px;min-height:22px;color:#714930;margin:14px 0 0}.foot{font-size:12px;margin:26px 0 0}#viewer{height:100svh;display:flex;flex-direction:column}header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 20px;background:#fff;border-bottom:1px solid #d8ddd6;font-size:14px}header button{font-size:13px;padding:8px 12px}iframe{display:block;flex:1;width:100%;min-height:0;border:0;background:#fff}@media(max-width:480px){.card{padding:28px 24px}header{padding:8px 12px}}
</style><script src="../unlock.js" defer></script></head>
<body><main id="login"><section class="card" aria-labelledby="title"><div class="brand">Slimmer dan Gisteren</div><div class="lock">Besloten klantomgeving</div><h1 id="title">MKB Advies</h1><p>Bekijk je resultaten, advertenties en meetingverslagen.</p><form><label for="password">Wachtwoord</label><input id="password" name="password" type="password" autocomplete="current-password" required><label class="show"><input id="show" type="checkbox">Toon wachtwoord</label><button id="submit" type="submit">Open dashboard</button><p id="status" role="status" aria-live="polite"></p></form><p class="foot">De dashboardinhoud is versleuteld. Deel je wachtwoord alleen met bevoegde personen.</p></section></main><section id="viewer" hidden aria-label="Geopend dashboard"><header><span>MKB Advies · Klantdashboard</span><button id="lock" type="button">Vergrendelen</button></header><iframe title="Dashboard MKB Advies" referrerpolicy="no-referrer" allow="fullscreen"></iframe></section></body></html>
