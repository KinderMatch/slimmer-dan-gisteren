name: SDG scheduled-event diagnostic

on:
  schedule:
    - cron: '*/5 * * * *'

permissions: {}

jobs:
  scheduled-pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Confirm GitHub scheduler dispatch without client data or Google access
        run: |
          echo 'GitHub created a genuine schedule event.'
          date -u '+%Y-%m-%dT%H:%M:%SZ'
