name: Dagelijkse dashboardverversing

on:
  workflow_dispatch:
  schedule:
    - cron: '0,17,37 6 * * *'
    - cron: '0,17,37 7 * * *'

permissions: {}

concurrency:
  group: sdg-dashboard-refresh
  cancel-in-progress: false

jobs:
  clock:
    if: github.event_name == 'workflow_dispatch' || vars.SDG_DASHBOARD_REFRESH_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      run: ${{ steps.clock.outputs.run }}
    steps:
      - id: clock
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          python3 - <<'PY'
          import datetime, json, os, urllib.request
          from zoneinfo import ZoneInfo
          now = datetime.datetime.now(ZoneInfo('Europe/Amsterdam'))
          utc_hour = 8 - int(now.utcoffset().total_seconds() // 3600)
          expected_schedule = f'0,17,37 {utc_hour} * * *'
          schedule = os.environ.get('EVENT_SCHEDULE', '')
          repo = 'KinderMatch/slimmer-dan-gisteren'

          def public_json(path):
              request = urllib.request.Request(
                  'https://api.github.com/repos/' + repo + path,
                  headers={'Accept': 'application/vnd.github+json', 'User-Agent': 'SDG-dashboard-clock'})
              with urllib.request.urlopen(request, timeout=10) as response:
                  return json.load(response)

          def verified_today():
              try:
                  runs = public_json('/actions/runs?status=completed&per_page=20')['workflow_runs']
                  for prior in runs:
                      if str(prior['id']) == os.environ.get('GITHUB_RUN_ID'):
                          continue
                      if prior.get('path') != '.github/workflows/refresh-dashboards.yml':
                          continue
                      if prior.get('conclusion') != 'success':
                          continue
                      started = datetime.datetime.fromisoformat(prior['created_at'].replace('Z', '+00:00'))
                      if started.astimezone(now.tzinfo).date() != now.date():
                          continue
                      jobs = public_json('/actions/runs/' + str(int(prior['id'])) + '/jobs')['jobs']
                      source_ok = any(j['name'] == 'refresh' and j.get('conclusion') == 'success' for j in jobs)
                      production_ok = any(j['name'].endswith('verify-dashboards') and j.get('conclusion') == 'success' for j in jobs)
                      if source_ok and production_ok:
                          return True
              except (OSError, ValueError, KeyError, TypeError):
                  print('Prior full publication could not be confirmed; keep retry enabled.')
              return False

          run = os.environ['EVENT_NAME'] == 'workflow_dispatch' or (
              os.environ['EVENT_NAME'] == 'schedule' and
              schedule == expected_schedule and
              not verified_today()
          )
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('run=' + str(run).lower() + '\n')
          PY

  refresh:
    needs: clock
    if: needs.clock.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    outputs:
      commit: ${{ steps.refresh.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read-only Google identity for the four approved private source files
        id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.SDG_GOOGLE_WIF_PROVIDER }}
          service_account: ${{ vars.SDG_GOOGLE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: 'https://www.googleapis.com/auth/drive.readonly,https://www.googleapis.com/auth/spreadsheets.readonly'
          create_credentials_file: false
          export_environment_variables: false
      - name: Validate complete sources and publish only two encrypted bundles
        id: refresh
        env:
          SDG_GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          SDG_DASHBOARD_SOURCES: ${{ vars.SDG_DASHBOARD_SOURCES }}
        run: python3 scripts/refresh-private-dashboards.py

  publish-and-verify:
    needs: refresh
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
    with:
      source_ref: ${{ needs.refresh.outputs.commit }}
